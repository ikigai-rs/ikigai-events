[package]
name = "ikigai-events"
description = "The identifiers ikigai's event-facing modules share: entries, feeds, cursors, feed epochs, transitions, idempotency and fencing keys, and the CloudEvents attribute mapping."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["ikigai", "roc", "events", "cloudevents", "rdf"]
categories = ["wasm"]
# Unpublished until the identifiers are reviewed (ledger #4126).
publish = false

[dependencies]
# For core's types, not its kernel: `IdempotencyKey` (the token a keyed Sink takes, with its
# one alphabet check) and `ContentHasher`/`ContentId` (core's digest and its `b3:` text form),
# so neither is restated here. 0.4.2 is the floor: the idempotency toolkit arrived there.
ikigai-core = "0.4.2"

[dev-dependencies]
# Reads the vector cases and writes the vectors (tests/vectors.rs).
serde_json = "1"
