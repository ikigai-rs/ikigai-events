[workspace]
resolver = "2"
# The shared identifiers crate first; bridges join as subcrates beside it (crates/ikigai-events-*),
# each depending on it, never the reverse.
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Measured (ledger #4171): the cloudevents bridge's RFC 3339 parser, `time` 0.3.55, requires 1.88,
# so rustc 1.87 refuses the build; clippy -D warnings and the tests pass on 1.88.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-events"
